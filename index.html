<!DOCTYPE html>
<html lang="ht">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lavi mwen - Jwèt</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: #1a1a2e;
            color: #eee;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px;
        }
        .game-container {
            background: #16213e;
            border-radius: 16px;
            width: 100%;
            max-width: 600px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        h1 {
            text-align: center;
            color: #00d9ff;
            margin-bottom: 10px;
            font-size: 1.8rem;
        }
        .stats {
            display: flex;
            justify-content: space-around;
            background: #0f3460;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 0.95rem;
        }
        .stat {
            text-align: center;
        }
        .stat span {
            display: block;
            font-weight: bold;
            color: #00ff9f;
            font-size: 1.2rem;
        }
        .location {
            background: #0f3460;
            padding: 18px;
            border-radius: 12px;
            margin-bottom: 20px;
            min-height: 120px;
        }
        .location h2 {
            color: #ff9f1c;
            margin-bottom: 10px;
            font-size: 1.3rem;
        }
        .location p {
            line-height: 1.5;
            color: #ddd;
        }
        .actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        button {
            background: #e94560;
            color: white;
            border: none;
            padding: 14px 10px;
            border-radius: 10px;
            font-size: 0.95rem;
            cursor: pointer;
            transition: 0.2s;
            font-weight: 600;
        }
        button:hover {
            background: #ff6b6b;
            transform: translateY(-2px);
        }
        button:disabled {
            background: #555;
            cursor: not-allowed;
            transform: none;
        }
        .message {
            margin-top: 15px;
            padding: 12px;
            background: #0f3460;
            border-left: 4px solid #00d9ff;
            border-radius: 8px;
            min-height: 50px;
            font-size: 0.95rem;
        }
        .footer {
            text-align: center;
            margin-top: 20px;
            font-size: 0.8rem;
            color: #888;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>🏠 Lavi mwen</h1>

        <div class="stats">
            <div class="stat">
                Enèji
                <span id="energy">100</span>
            </div>
            <div class="stat">
                Lajan
                <span id="money">500</span> G
            </div>
            <div class="stat">
                Grangou
                <span id="hunger">20</span>
            </div>
        </div>

        <div class="location">
            <h2 id="location-name">Chanm ou</h2>
            <p id="location-desc">Ou nan chanm ou. Li fè nwa yon ti jan. Ou jis leve.</p>
        </div>

        <div class="actions" id="actions">
            <!-- Bouton yo ap ajoute otomatikman -->
        </div>

        <div class="message" id="message">
            Byenveni nan jwèt la! Kòmanse pa leve oswa fè yon aksyon.
        </div>

        <div class="footer">
            Prototype v1 • Ou ka modifye li jan ou vle
        </div>
    </div>

    <script>
        // ========== ETA JWE A ==========
        let state = {
            location: "chanm",
            energy: 100,
            money: 500,
            hunger: 20,
            hasCar: true,
            hasMoto: true,
            showered: false,
            message: "Byenveni! Ou jis leve nan chanm ou."
        };

        // ========== DESKRIPSYON KOTE YO ==========
        const places = {
            chanm: {
                name: "Chanm ou",
                desc: "Ou nan chanm ou. Gen yon kabann, yon tab, ak yon zafè rad. Ou ka dòmi oswa soti."
            },
            douche: {
                name: "Salle de bain",
                desc: "Ou nan salle de bain lan. Gen douche, twalèt, ak mirwa."
            },
            cuisine: {
                name: "Cuisine / Sal a manje",
                desc: "Ou nan cuisine a. Gen frijidè, fò, ak tab pou manje."
            },
            salon: {
                name: "Salon",
                desc: "Ou nan salon an. Gen kanape, televizyon, ak yon ti tablo."
            },
            garaj: {
                name: "Garaj",
                desc: "Ou nan garaj la. Machin ou ak moto ou la. Ou ka pran yo pou soti."
            },
            lari: {
                name: "Lari a",
                desc: "Ou deyò nan lari a. Ou ka ale nan makèt, lopital, oswa retounen lakay."
            },
            maket: {
                name: "Makèt",
                desc: "Ou nan makèt la. Ou ka achte manje ak lòt bagay."
            },
            lopital: {
                name: "Lopital",
                desc: "Ou nan lopital la. Ou ka fè tcheke sante ou (pou kounye a li jis la)."
            }
        };

        // ========== FONKSYON POU AFISE ==========
        function updateUI() {
            document.getElementById("energy").textContent = state.energy;
            document.getElementById("money").textContent = state.money;
            document.getElementById("hunger").textContent = state.hunger;
            document.getElementById("location-name").textContent = places[state.location].name;
            document.getElementById("location-desc").textContent = places[state.location].desc;
            document.getElementById("message").textContent = state.message;

            renderActions();
        }

        function renderActions() {
            const actionsDiv = document.getElementById("actions");
            actionsDiv.innerHTML = "";

            const buttons = getPossibleActions();

            buttons.forEach(btn => {
                const button = document.createElement("button");
                button.textContent = btn.label;
                button.disabled = btn.disabled || false;
                button.onclick = btn.action;
                actionsDiv.appendChild(button);
            });
        }

        // ========== AKSYon KI POSIB SELON KOTE ==========
        function getPossibleActions() {
            const loc = state.location;
            let buttons = [];

            // Aksyon komen
            if (loc === "chanm") {
                buttons.push({ label: "😴 Dòmi (recharge enèji)", action: () => sleep() });
                buttons.push({ label: "🚪 Ale nan Salon", action: () => goTo("salon") });
                buttons.push({ label: "🚿 Ale nan Douche", action: () => goTo("douche") });
            }

            if (loc === "douche") {
                buttons.push({ label: "🧼 Benyen (refrese)", action: () => takeShower() });
                buttons.push({ label: "🚪 Tounen nan Chanm", action: () => goTo("chanm") });
                buttons.push({ label: "🚪 Ale nan Salon", action: () => goTo("salon") });
            }

            if (loc === "salon") {
                buttons.push({ label: "📺 Gade televizyon", action: () => watchTV() });
                buttons.push({ label: "🚪 Ale nan Chanm", action: () => goTo("chanm") });
                buttons.push({ label: "🚪 Ale nan Cuisine", action: () => goTo("cuisine") });
                buttons.push({ label: "🚪 Ale nan Garaj", action: () => goTo("garaj") });
                buttons.push({ label: "🚪 Soti deyò (Lari)", action: () => goTo("lari") });
            }

            if (loc === "cuisine") {
                buttons.push({ label: "🍽️ Manje", action: () => eat() });
                buttons.push({ label: "🚪 Tounen nan Salon", action: () => goTo("salon") });
            }

            if (loc === "garaj") {
                buttons.push({ label: "🚗 Pran machin nan epi soti", action: () => goTo("lari") });
                buttons.push({ label: "🏍️ Pran moto a epi soti", action: () => goTo("lari") });
                buttons.push({ label: "🚪 Tounen nan Salon", action: () => goTo("salon") });
            }

            if (loc === "lari") {
                buttons.push({ label: "🛒 Ale nan Makèt", action: () => goTo("maket") });
                buttons.push({ label: "🏥 Ale nan Lopital", action: () => goTo("lopital") });
                buttons.push({ label: "🏠 Tounen lakay (Salon)", action: () => goTo("salon") });
            }

            if (loc === "maket") {
                buttons.push({ label: "🍎 Achte manje (50 G)", action: () => buyFood() });
                buttons.push({ label: "🚪 Tounen nan Lari", action: () => goTo("lari") });
            }

            if (loc === "lopital") {
                buttons.push({ label: "💊 Fè tcheke sante", action: () => checkHealth() });
                buttons.push({ label: "🚪 Tounen nan Lari", action: () => goTo("lari") });
            }

            return buttons;
        }

        // ========== FONKSYON AKSYon ==========
        function goTo(place) {
            if (state.energy < 5) {
                state.message = "Ou twò fatige! Ou bezwen dòmi oswa manje.";
                updateUI();
                return;
            }
            state.location = place;
            state.energy -= 5;
            state.hunger += 3;
            state.message = `Ou ale nan ${places[place].name}.`;
            checkStats();
            updateUI();
        }

        function sleep() {
            state.energy = Math.min(100, state.energy + 40);
            state.hunger += 10;
            state.message = "Ou dòmi byen. Enèji ou ogmante!";
            checkStats();
            updateUI();
        }

        function takeShower() {
            state.energy = Math.min(100, state.energy + 10);
            state.showered = true;
            state.message = "Ou benyen. Ou santi ou fre epi pwòp!";
            updateUI();
        }

        function eat() {
            if (state.hunger <= 10) {
                state.message = "Ou pa grangou anpil kounye a.";
            } else {
                state.hunger = Math.max(0, state.hunger - 30);
                state.energy = Math.min(100, state.energy + 15);
                state.message = "Ou manje byen. Grangou ou desann!";
            }
            checkStats();
            updateUI();
        }

        function watchTV() {
            state.energy = Math.max(0, state.energy - 5);
            state.hunger += 5;
            state.message = "Ou gade televizyon yon ti moman. Ou ri yon ti jan.";
            checkStats();
            updateUI();
        }

        function buyFood() {
            if (state.money < 50) {
                state.message = "Ou pa gen ase lajan!";
            } else {
                state.money -= 50;
                state.hunger = Math.max(0, state.hunger - 40);
                state.message = "Ou achte manje. Ou santi ou pi byen!";
            }
            updateUI();
        }

        function checkHealth() {
            state.message = "Doktè a di ou an sante! (Poukounye a pa gen maladi nan jwèt la)";
            updateUI();
        }

        function checkStats() {
            if (state.energy <= 0) {
                state.energy = 0;
                state.message = "Ou tonbe akoz fatig! Ou dòmi fòse.";
                state.location = "chanm";
                state.energy = 30;
            }
            if (state.hunger >= 100) {
                state.hunger = 100;
                state.message = "Ou twò grangou! Ou bezwen manje rapid.";
                state.energy = Math.max(0, state.energy - 15);
            }
        }

        // Kòmanse jwèt la
        updateUI();
    </script>
</body>
</html>

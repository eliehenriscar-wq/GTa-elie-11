<!DOCTYPE html>
<html lang="ht">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lavi mwen - Kontwòl Pèsonaj</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }
        h1 { color: #00d9ff; margin: 10px 0; font-size: 1.6rem; }
        .stats {
            display: flex;
            gap: 25px;
            background: #1a1a2e;
            padding: 10px 20px;
            border-radius: 12px;
            margin-bottom: 12px;
            font-size: 1rem;
        }
        .stats span { color: #00ff9f; font-weight: bold; }
        #game {
            position: relative;
            width: 700px;
            height: 500px;
            background: #2d3436;
            border: 4px solid #00d9ff;
            border-radius: 12px;
            overflow: hidden;
        }
        .room {
            position: absolute;
            border: 2px solid #636e72;
            background: #2d3436;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            color: #b2bec3;
        }
        #player {
            position: absolute;
            width: 40px;
            height: 40px;
            font-size: 34px;
            line-height: 40px;
            text-align: center;
            z-index: 10;
            transition: none;
        }
        .object {
            position: absolute;
            font-size: 28px;
            z-index: 5;
            cursor: pointer;
        }
        #message {
            margin-top: 12px;
            background: #1a1a2e;
            padding: 12px 20px;
            border-radius: 10px;
            width: 700px;
            text-align: center;
            min-height: 50px;
            border-left: 5px solid #00d9ff;
        }
        .controls {
            margin-top: 10px;
            color: #aaa;
            font-size: 0.9rem;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>🏠 Lavi mwen</h1>

    <div class="stats">
        <div>Enèji: <span id="energy">100</span></div>
        <div>Lajan: <span id="money">500</span> G</div>
        <div>Grangou: <span id="hunger">30</span></div>
    </div>

    <div id="game">
        <!-- Chanm -->
        <div class="room" style="left:0; top:0; width:350px; height:250px; background:#3d3d5c;">
            Chanm
        </div>
        <!-- Salon -->
        <div class="room" style="left:350px; top:0; width:350px; height:250px; background:#2c3e50;">
            Salon
        </div>
        <!-- Douche -->
        <div class="room" style="left:0; top:250px; width:200px; height:250px; background:#1e3799;">
            Douche
        </div>
        <!-- Cuisine -->
        <div class="room" style="left:200px; top:250px; width:250px; height:250px; background:#6ab04c;">
            Cuisine
        </div>
        <!-- Garaj -->
        <div class="room" style="left:450px; top:250px; width:250px; height:250px; background:#535c68;">
            Garaj
        </div>

        <!-- Objek -->
        <div class="object" id="bed" style="left:40px; top:40px;">🛏️</div>
        <div class="object" id="shower" style="left:50px; top:320px;">🚿</div>
        <div class="object" id="fridge" style="left:280px; top:320px;">🧊</div>
        <div class="object" id="tv" style="left:480px; top:40px;">📺</div>
        <div class="object" id="car" style="left:520px; top:340px;">🚗</div>
        <div class="object" id="door" style="left:620px; top:200px;">🚪</div>

        <!-- Pèsonaj -->
        <div id="player">🧑</div>
    </div>

    <div id="message">Sèvi ak flèch oswa WASD pou mache. Peze <b>E</b> lè ou tou pre yon bagay pou entèaji.</div>

    <div class="controls">
        Flèch / WASD = Mache &nbsp;&nbsp;|&nbsp;&nbsp; E = Entèaji &nbsp;&nbsp;|&nbsp;&nbsp; Tou pre kabann, douche, frijidè, machin, pòt...
    </div>

    <script>
        const player = document.getElementById("player");
        const message = document.getElementById("message");

        let x = 80;
        let y = 100;
        let energy = 100;
        let money = 500;
        let hunger = 30;
        const speed = 4;

        const keys = {};

        // Objek pozisyon
        const objects = {
            bed:    { x: 40,  y: 40,  w: 40, h: 40, action: "sleep" },
            shower: { x: 50,  y: 320, w: 40, h: 40, action: "shower" },
            fridge: { x: 280, y: 320, w: 40, h: 40, action: "eat" },
            tv:     { x: 480, y: 40,  w: 40, h: 40, action: "tv" },
            car:    { x: 520, y: 340, w: 40, h: 40, action: "car" },
            door:   { x: 620, y: 200, w: 40, h: 40, action: "outside" }
        };

        function updateStats() {
            document.getElementById("energy").textContent = energy;
            document.getElementById("money").textContent = money;
            document.getElementById("hunger").textContent = hunger;
        }

        function showMessage(text) {
            message.innerHTML = text;
        }

        function isNear(obj) {
            return Math.abs(x - obj.x) < 50 && Math.abs(y - obj.y) < 50;
        }

        function interact() {
            for (let key in objects) {
                const obj = objects[key];
                if (isNear(obj)) {
                    doAction(obj.action);
                    return;
                }
            }
            showMessage("Pa gen anyen tou pre ou pou entèaji.");
        }

        function doAction(action) {
            if (action === "sleep") {
                energy = Math.min(100, energy + 40);
                hunger += 10;
                showMessage("Ou dòmi sou kabann nan. Enèji ou monte!");
            }
            else if (action === "shower") {
                energy = Math.min(100, energy + 15);
                showMessage("Ou benyen. Ou santi ou fre!");
            }
            else if (action === "eat") {
                if (hunger > 10) {
                    hunger = Math.max(0, hunger - 35);
                    energy = Math.min(100, energy + 15);
                    showMessage("Ou manje. Grangou ou desann!");
                } else {
                    showMessage("Ou pa grangou anpil.");
                }
            }
            else if (action === "tv") {
                energy = Math.max(0, energy - 5);
                hunger += 5;
                showMessage("Ou gade televizyon yon ti moman.");
            }
            else if (action === "car") {
                showMessage("Ou monte nan machin nan... (Poukounye a ou rete nan garaj la)");
            }
            else if (action === "outside") {
                showMessage("Ou soti deyò! (Nou pral ajoute lari, makèt, lopital pita)");
            }
            updateStats();
        }

        function movePlayer() {
            let newX = x;
            let newY = y;

            if (keys["ArrowUp"] || keys["w"] || keys["W"]) newY -= speed;
            if (keys["ArrowDown"] || keys["s"] || keys["S"]) newY += speed;
            if (keys["ArrowLeft"] || keys["a"] || keys["A"]) newX -= speed;
            if (keys["ArrowRight"] || keys["d"] || keys["D"]) newX += speed;

            // Limit nan ekran an
            newX = Math.max(0, Math.min(660, newX));
            newY = Math.max(0, Math.min(460, newY));

            x = newX;
            y = newY;

            player.style.left = x + "px";
            player.style.top = y + "px";

            // Ti fatig lè w ap mache
            if (keys["ArrowUp"] || keys["ArrowDown"] || keys["ArrowLeft"] || keys["ArrowRight"] ||
                keys["w"] || keys["a"] || keys["s"] || keys["d"] || keys["W"] || keys["A"] || keys["S"] || keys["D"]) {
                energy = Math.max(0, energy - 0.02);
                hunger = Math.min(100, hunger + 0.015);
                updateStats();
            }
        }

        document.addEventListener("keydown", (e) => {
            keys[e.key] = true;

            if (e.key === "e" || e.key === "E") {
                interact();
            }
        });

        document.addEventListener("keyup", (e) => {
            keys[e.key] = false;
        });

        // Bouk jwèt
        function gameLoop() {
            movePlayer();
            requestAnimationFrame(gameLoop);
        }

        // Kòmanse
        player.style.left = x + "px";
        player.style.top = y + "px";
        updateStats();
        gameLoop();
    </script>
</body>
</html>

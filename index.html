<!DOCTYPE html>
<html lang="ht">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lavi mwen - Jwèt</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: #1a1a2e;
            color: #eee;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 20px;
        }
        .game-container {
            background: #16213e;
            border-radius: 16px;
            width: 100%;
            max-width: 520px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        h1 {
            text-align: center;
            color: #00d9ff;
            margin-bottom: 15px;
            font-size: 1.7rem;
        }
        .stats {
            display: flex;
            justify-content: space-around;
            background: #0f3460;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 18px;
            font-size: 0.95rem;
        }
        .stat {
            text-align: center;
        }
        .stat span {
            display: block;
            font-weight: bold;
            color: #00ff9f;
            font-size: 1.25rem;
        }
        .character-area {
            background: #0f3460;
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            margin-bottom: 18px;
            min-height: 180px;
        }
        .character {
            font-size: 5.5rem;
            line-height: 1;
            margin-bottom: 10px;
            transition: 0.3s;
        }
        .location-name {
            color: #ff9f1c;
            font-size: 1.3rem;
            font-weight: bold;
            margin-bottom: 6px;
        }
        .location-desc {
            color: #ccc;
            font-size: 0.95rem;
            line-height: 1.4;
        }
        .actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }
        button {
            background: #e94560;
            color: white;
            border: none;
            padding: 14px 8px;
            border-radius: 10px;
            font-size: 0.92rem;
            cursor: pointer;
            font-weight: 600;
            transition: 0.2s;
        }
        button:hover {
            background: #ff6b6b;
            transform: translateY(-2px);
        }
        button:disabled {
            background: #555;
            cursor: not-allowed;
            transform: none;
        }
        .message {
            background: #0f3460;
            border-left: 5px solid #00d9ff;
            padding: 12px 15px;
            border-radius: 8px;
            font-size: 0.95rem;
            min-height: 55px;
        }
        .footer {
            text-align: center;
            margin-top: 15px;
            font-size: 0.78rem;
            color: #777;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>🏠 Lavi mwen</h1>

        <div class="stats">
            <div class="stat">Enèji<br><span id="energy">100</span></div>
            <div class="stat">Lajan<br><span id="money">500</span> G</div>
            <div class="stat">Grangou<br><span id="hunger">20</span></div>
        </div>

        <div class="character-area">
            <div class="character" id="character">🧑</div>
            <div class="location-name" id="location-name">Chanm ou</div>
            <div class="location-desc" id="location-desc">Ou nan chanm ou. Ou jis leve.</div>
        </div>

        <div class="actions" id="actions"></div>

        <div class="message" id="message">Byenveni! Ou ka wè pèsonaj ou kounye a.</div>

        <div class="footer">Prototype v2 • Pèsonaj vizyèl + aksyon</div>
    </div>

    <script>
        let state = {
            location: "chanm",
            energy: 100,
            money: 500,
            hunger: 20,
            message: "Byenveni! Ou jis leve nan chanm ou."
        };

        const places = {
            chanm:  { name: "Chanm ou",           emoji: "🛏️", desc: "Ou nan chanm ou. Gen kabann ak rad." },
            douche: { name: "Salle de bain",      emoji: "🚿", desc: "Ou nan salle de bain lan." },
            cuisine:{ name: "Cuisine",            emoji: "🍳", desc: "Ou nan cuisine a. Ou ka manje." },
            salon:  { name: "Salon",              emoji: "🛋️", desc: "Ou nan salon an. Gen TV." },
            garaj:  { name: "Garaj",              emoji: "🚗", desc: "Ou nan garaj la. Machin ak moto ou la." },
            lari:   { name: "Lari a",             emoji: "🛣️", desc: "Ou deyò nan lari a." },
            maket:  { name: "Makèt",              emoji: "🛒", desc: "Ou nan makèt la." },
            lopital:{ name: "Lopital",            emoji: "🏥", desc: "Ou nan lopital la." }
        };

        function getCharacterEmoji() {
            if (state.energy < 25) return "😴";
            if (state.hunger > 70) return "😩";
            if (state.location === "douche") return "🧼";
            if (state.location === "cuisine") return "🍽️";
            if (state.location === "garaj") return "🧑‍🔧";
            if (state.location === "lari") return "🚶";
            if (state.location === "maket") return "🛍️";
            if (state.location === "lopital") return "🤒";
            return "🧑";
        }

        function updateUI() {
            document.getElementById("energy").textContent = state.energy;
            document.getElementById("money").textContent = state.money;
            document.getElementById("hunger").textContent = state.hunger;

            document.getElementById("character").textContent = getCharacterEmoji();
            document.getElementById("location-name").textContent = places[state.location].name;
            document.getElementById("location-desc").textContent = places[state.location].desc;
            document.getElementById("message").textContent = state.message;

            renderActions();
        }

        function renderActions() {
            const div = document.getElementById("actions");
            div.innerHTML = "";
            const buttons = getPossibleActions();

            buttons.forEach(btn => {
                const b = document.createElement("button");
                b.textContent = btn.label;
                b.onclick = btn.action;
                div.appendChild(b);
            });
        }

        function getPossibleActions() {
            const loc = state.location;
            let btns = [];

            if (loc === "chanm") {
                btns.push({ label: "😴 Dòmi", action: () => sleep() });
                btns.push({ label: "🚪 Ale Salon", action: () => goTo("salon") });
                btns.push({ label: "🚿 Ale Douche", action: () => goTo("douche") });
            }
            if (loc === "douche") {
                btns.push({ label: "🧼 Benyen", action: () => takeShower() });
                btns.push({ label: "🚪 Tounen Chanm", action: () => goTo("chanm") });
                btns.push({ label: "🚪 Ale Salon", action: () => goTo("salon") });
            }
            if (loc === "salon") {
                btns.push({ label: "📺 Gade TV", action: () => watchTV() });
                btns.push({ label: "🚪 Ale Chanm", action: () => goTo("chanm") });
                btns.push({ label: "🚪 Ale Cuisine", action: () => goTo("cuisine") });
                btns.push({ label: "🚪 Ale Garaj", action: () => goTo("garaj") });
                btns.push({ label: "🚪 Soti deyò", action: () => goTo("lari") });
            }
            if (loc === "cuisine") {
                btns.push({ label: "🍽️ Manje", action: () => eat() });
                btns.push({ label: "🚪 Tounen Salon", action: () => goTo("salon") });
            }
            if (loc === "garaj") {
                btns.push({ label: "🚗 Pran machin", action: () => goTo("lari") });
                btns.push({ label: "🏍️ Pran moto", action: () => goTo("lari") });
                btns.push({ label: "🚪 Tounen Salon", action: () => goTo("salon") });
            }
            if (loc === "lari") {
                btns.push({ label: "🛒 Ale Makèt", action: () => goTo("maket") });
                btns.push({ label: "🏥 Ale Lopital", action: () => goTo("lopital") });
                btns.push({ label: "🏠 Tounen lakay", action: () => goTo("salon") });
            }
            if (loc === "maket") {
                btns.push({ label: "🍎 Achte manje (50G)", action: () => buyFood() });
                btns.push({ label: "🚪 Tounen Lari", action: () => goTo("lari") });
            }
            if (loc === "lopital") {
                btns.push({ label: "💊 Tcheke sante", action: () => checkHealth() });
                btns.push({ label: "🚪 Tounen Lari", action: () => goTo("lari") });
            }
            return btns;
        }

        function goTo(place) {
            if (state.energy < 8) {
                state.message = "Ou twò fatige! Dòmi oswa manje rapid.";
                updateUI();
                return;
            }
            state.location = place;
            state.energy -= 6;
            state.hunger += 4;
            state.message = `Ou ale nan ${places[place].name}.`;
            checkStats();
            updateUI();
        }

        function sleep() {
            state.energy = Math.min(100, state.energy + 45);
            state.hunger += 12;
            state.message = "Ou dòmi byen. Enèji ou monte!";
            checkStats();
            updateUI();
        }

        function takeShower() {
            state.energy = Math.min(100, state.energy + 12);
            state.message = "Ou benyen. Ou santi ou fre epi pwòp!";
            updateUI();
        }

        function eat() {
            if (state.hunger < 15) {
                state.message = "Ou pa grangou anpil kounye a.";
            } else {
                state.hunger = Math.max(0, state.hunger - 35);
                state.energy = Math.min(100, state.energy + 18);
                state.message = "Ou manje byen!";
            }
            checkStats();
            updateUI();
        }

        function watchTV() {
            state.energy = Math.max(0, state.energy - 6);
            state.hunger += 6;
            state.message = "Ou gade televizyon. Ou detann ou.";
            checkStats();
            updateUI();
        }

        function buyFood() {
            if (state.money < 50) {
                state.message = "Ou pa gen ase lajan!";
            } else {
                state.money -= 50;
                state.hunger = Math.max(0, state.hunger - 45);
                state.message = "Ou achte manje. Grangou ou desann!";
            }
            updateUI();
        }

        function checkHealth() {
            state.message = "Doktè a di ou an sante! Pa gen pwoblèm.";
            updateUI();
        }

        function checkStats() {
            if (state.energy <= 0) {
                state.energy = 0;
                state.message = "Ou tonbe akoz fatig! Ou tounen nan chanm.";
                state.location = "chanm";
                state.energy = 35;
            }
            if (state.hunger >= 100) {
                state.hunger = 100;
                state.message = "Ou twò grangou! Ou pèdi enèji.";
                state.energy = Math.max(0, state.energy - 20);
            }
        }

        updateUI();
    </script>
</body>
</html>
